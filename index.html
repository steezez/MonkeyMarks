    @font-face {
    font-family: "SatoshiBold";app.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var verifyScreen = document.getElementById('screen-verify');
        var permitScreen = document.getElementById('screen-permit');

        // Reveal permit right now, underneath — it needs to already be
        // visible so it shows through as verify physically slides off it.
        permitScreen.classList.add('active');
        indicatorTarget = 'permit';
        updateIndicator(true);

        // Pin verify as one solid full-screen layer on top of permit, so
        // the transform moves the ENTIRE screen — header, QR, timer, all
        // of it — as a single slab, not just the inner content.
        verifyScreen.style.position = 'fixed';
        verifyScreen.style.top = '0';
        verifyScreen.style.left = '0';
        verifyScreen.style.width = '100%';
        verifyScreen.style.height = '100%';
        verifyScreen.style.zIndex = '500';
        verifyScreen.style.transition = 'none';
        verifyScreen.style.transform = 'translateY(0)';
        void verifyScreen.offsetWidth; // force reflow before animating

        verifyScreen.style.transition = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';
        verifyScreen.style.transform = 'translateY(100%)';

        setTimeout(function () {
            stopVerifyTimer();
            setLock(false);

            verifyScreen.classList.remove('active', 'entering', 'entering-slide-left');
            verifyScreen.removeAttribute('style');

            var wrapper = verifyScreen.querySelector('.page-wrapper');
            wrapper.removeAttribute('style');
            // leave 'slide-up' class on the wrapper as-is, so it's already
            // in its resting visible position next time verify opens
        }, 450);
    });
});
    src: url("./Satoshi-Bold.otf") format("opentype");

/* ===== Shared reset ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
a, a:focus, a:active, a:hover {
    outline: none;
    background-color: transparent;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
}
html, body {
    touch-action: pan-x pan-y;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* ===== Refresh Timestamp Bar ===== */
/* ===== Refresh Timestamp Bar ===== */
.refresh-bar {
    background-color: #ffffff;
    color: #3c4b60;
    font-size: 11px;
    font-weight: 400;
    text-align: center;
    padding: 8px 12px;
    border-bottom: 1px solid #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.refresh-bar strong {
    font-weight: 600;
}

/* ===== Screen switcher ===== */
.screen { display: none; }
.screen.active { display: block; }

/* Fixed white bar painted over the notch/Dynamic Island area. Sits above
   everything but is NOT part of page flow, so it can't shift any existing
   header height or button position. */
.status-bar-fill {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: #FFFFFF; /* TEMP diagnostic color — will be set back to white */
    z-index: 9999;
    pointer-events: none;
}

/* Lightweight fade used when switching into permit/identity/age/verify */
.screen.entering {
    position: relative;
    z-index: 2;
    animation: screenFadeIn 0.28s cubic-bezier(.2,.8,.2,1);
}
.screen.leaving {
    display: block;
    pointer-events: none;
    animation: screenFadeOut 0.28s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes screenFadeIn {
    from { opacity: 0; filter: saturate(.96); }
    to { opacity: 1; filter: saturate(1); }
}
@keyframes screenFadeOut {
    from { opacity: 1; filter: saturate(1); }
    to { opacity: 0; filter: saturate(.96); }
}
/* ===== Slower, Smoother Slide In ===== */
.screen.entering-slide-left {
    position: relative;
    z-index: 2;
    /* 0.6s duration with a very smooth ease-out curve */
    animation: screenSlideInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes screenSlideInLeft {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}
/* Locks scroll while the landing screen OR the verify screen is active */
body.lock-scroll, html.lock-scroll {
    overflow: hidden;
    height: 100%;
    position: fixed;
    width: 100%;
    overscroll-behavior: none;
    touch-action: none;
}

/* ===== Loading Screen ===== */
#screen-loader {
    background-color: #F7F9F7;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none; 
    align-items: center;
    justify-content: center;
    z-index: 10000;
}
#screen-loader.active {
    display: flex !important;
}
.loader-spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    /* Updated to a darker, richer green (#15803D) */
   background: conic-gradient(from 180deg, rgba(118, 198, 101, 0) 0%, rgba(118, 198, 101, 1) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent 17px, #000 18px);
    mask: radial-gradient(farthest-side, transparent 17px, #000 18px);
    animation: spin 0.75s linear infinite;
}
#screen-splash {
    background-color: #F7F9F7;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    overflow: hidden;
}
#screen-splash.active {
    display: flex; /* higher specificity than .screen.active so this actually applies */
}
.splash-wrap {
    position: relative;
    width: 100%;
    height: 100%;
}
.splash-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.splash-wrap .loader-spinner {
    position: absolute;
    top: 50%;
    left: 46%;
    transform: translate(-50%, -50%);
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* ===== #screen-passcode (new front gate) ===== */
#screen-passcode {
    background: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
}
#screen-passcode .pc-wrap {
    max-width: 420px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(20px + env(safe-area-inset-top)) 32px calc(20px + env(safe-area-inset-bottom));
    overflow: hidden;
}
#screen-passcode .pc-lock-wrap {
    margin-top: auto;
    margin-bottom: 32px;
    flex-shrink: 0;
}
#screen-passcode .pc-lock-icon {
    width: 100px;
    height: 100px;
}
#screen-passcode .pc-title {
    font-family: "LeagueSpartan", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 21px; /* Reduced so long titles fit on narrow mobile screens */
    font-weight: 800;
    color: #111;
    text-align: center;
    margin: 0 0 32px;
    line-height: 1.25;
    flex-shrink: 0;
    white-space: nowrap; /* Forces text to stay on 1 single line */
}
#screen-passcode .pc-dots {
    display: flex;
    gap: 30px;
    margin-bottom: auto;
    flex-shrink: 0;
}
#screen-passcode .pc-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid #111;
    background: transparent;
    transition: background-color 120ms ease;
}
#screen-passcode .pc-dot.filled {
    background: #111;
}
#screen-passcode .pc-keypad-area {
    width: 100%;
    flex-shrink: 0;
}
#screen-passcode .pc-keypad {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    row-gap: 34px;
    column-gap: 10px;
}
#screen-passcode .pc-key {
    background: none;
    border: none;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 22px; /* Smaller digit size (down from 30px) */
    font-weight: 400; /* Thinner weight (down from ) */
    color: #111;
    padding: 10px 0;
    cursor: pointer;
    border-radius: 12px;
    transition: opacity 120ms ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;

}
#screen-passcode .pc-key:active,
#screen-passcode .pc-key.pressed {
    opacity: 0.25;
}
#screen-passcode .pc-key.pc-text-key {
    font-size: 17px;
    font-weight: 600;
}
#screen-passcode .pc-key.pc-icon-key {
    display: flex;
    align-items: center;
    justify-content: center;
}
#screen-passcode .pc-key.pc-icon-key svg {
    width: 26px;
    height: 26px;
}
#screen-passcode .pc-key:disabled {
    opacity: 0.2;
    cursor: default;
}

.segmented-overlay {

    pointer-events: none;

.indicator-mask {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--indicator-width, 0px);
    height: var(--indicator-height, 0px);
    border-radius: 999px;
    background: #253544;
    transform: translate3d(var(--indicator-x, 0px), var(--indicator-y, 0px), 0);
    transition:
        transform 780ms cubic-bezier(.2,.8,.2,1),
        width 780ms cubic-bezier(.2,.8,.2,1),
        height 780ms cubic-bezier(.2,.8,.2,1);
    will-change: transform, width, height;
}

    position: absolute;

  <!-- ===== screen-age (was page3.html) ===== -->
  <div class="screen" id="screen-age">
    <div class="header">
        <div class="back-arrow" data-back>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <a href="#" class="invisible-button btn-permit"   data-target="permit"></a>

  <div class="screen" id="screen-verify">
    <div class="page-wrapper">
      <div class="header">
        <div class="header-title">Verify Licence</div>
        <div class="back-arrow" data-close>Close</div>
      </div>
      <div class="timer" data-timer>02:00</div>
      <div class="content">
        <div class="image-container">
          <img src="idqr.png" alt="">
          <a href="#" class="invisible-button btn-permit"   data-target="permit"></a>
          <a href="#" class="invisible-button btn-identity" data-target="identity"></a>

<div class="segmented-overlay" aria-hidden="true">
    <div class="indicator-mask">
        <div class="indicator-pill">
            <span class="indicator-label">Permit</span>
        </div>
    </div>
</div>

<script>

     // Pre-decode all images in the background on startup
function preloadImages() {
    var imgs = document.querySelectorAll('img');
    imgs.forEach(function(img) {
        if (img.src) {
            var tempImg = new Image();
            tempImg.src = img.src;
            if (tempImg.decode) {
                tempImg.decode().catch(function() { /* ignore fallback errors */ });
            }
        }
    });
}

// Run it immediately when page loads
preloadImages();

// Your splash timer
setTimeout(function () {
    document.getElementById('screen-splash').classList.remove('active');
    document.getElementById('screen-passcode').classList.add('active');
}, 800);
     
(function () {
    var app = document.getElementById('app');

    var verifyTimerInterval = null;
    var segmentedOverlay = document.querySelector('.segmented-overlay');
    var indicatorLabel = segmentedOverlay.querySelector('.indicator-label');
    var indicatorTarget = 'permit';
    var indicatorFrame = null;
    var indicatorLabels = {
        permit: 'Permit',
        identity: 'Identity',
        age: 'Age'
    };
    var screenFadeDuration = 280;

    // Generates the timestamp dynamically matching "Last refresh: Wed 29 Jul 2026 9:46pm"
 function getFormattedRefreshTime() {
        var now = new Date();
        var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        
        var dayName = days[now.getDay()];
        var dayNum = now.getDate();
        var monthName = months[now.getMonth()];
        var year = now.getFullYear();
        
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var ampm = hours >= 12 ? 'pm' : 'am';
        
        hours = hours % 12;
        if (hours === 0) hours = 12;
        var minutesStr = minutes < 10 ? '0' + minutes : minutes;
        
        // Wrap the prefix in a <strong> tag
        return '<strong>Last refreshed:</strong> ' + dayName + ' ' + dayNum + ' ' + monthName + ' ' + year + ' ' + hours + ':' + minutesStr + ampm;
    }

    function initRefreshTime() {
        var refreshText = getFormattedRefreshTime();
        var refreshBars = document.querySelectorAll('[data-refresh-time]');
        refreshBars.forEach(function (bar) {
            // Change from .textContent to .innerHTML to parse the strong tag
            bar.innerHTML = refreshText; 
        });
    }

    // Set the initial time upon loading
    initRefreshTime();

    function shouldCorrectScroll() {
        return window.scrollY > 120;
    }

    function setLock(on) {
        document.body.classList.toggle('lock-scroll', on);
        document.documentElement.classList.toggle('lock-scroll', on);
    }

    function stopVerifyTimer() {
        if (verifyTimerInterval) {
            clearInterval(verifyTimerInterval);
            verifyTimerInterval = null;
        }
    }

    // Restarts the 2-minute countdown from scratch every time the verify
    // screen is entered, matching the original "fresh page load = fresh
    // timer" behaviour.
    function startVerifyTimer() {
        stopVerifyTimer();
        var timeLeft = 120;
        var timerEl = document.querySelector('#screen-verify [data-timer]');
        function render() {
            var m = Math.floor(timeLeft / 60);
            var s = timeLeft % 60;
            timerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }
        render();
        verifyTimerInterval = setInterval(function () {
            timeLeft--;
            render();
            if (timeLeft <= 0) stopVerifyTimer();
        }, 1000);
    }

    // Re-triggers the slide-up entrance every time the verify screen
    // becomes active.
   function replaySlideUp() {
        var wrapper = document.querySelector('#screen-verify .page-wrapper');
        wrapper.removeAttribute('style'); // clear any leftover inline transform/transition
        wrapper.classList.remove('slide-up', 'slide-down');
        void wrapper.offsetWidth;
        wrapper.classList.add('slide-up');
    }

    // Resets the landing screen back to its neutral (non-slid-out)
    // position whenever it becomes active again, so returning via the
    // back arrow doesn't show it mid-slide.
    function resetLanding() {
        var landing = document.getElementById('screen-landing');
        landing.style.transition = 'none';
        landing.style.transform = 'translateX(0)';
    }

    function isSegmentTarget(name) {
        return name === 'permit' || name === 'identity' || name === 'age';
    }

    function isSegmentScreen(screen) {
        return screen && /^screen-(permit|identity|age)$/.test(screen.id);
    }

    function getVisibleSegmentButton(name) {
        var screen = app.querySelector('.screen.active');
        if (!screen || !/^screen-(permit|identity|age)$/.test(screen.id)) return null;
        return screen ? screen.querySelector('.btn-' + name) : null;
    }

    function positionIndicator(button, instant) {
        if (!button) {
            segmentedOverlay.classList.remove('is-ready');
            return;
        }

        var container = button.closest('.image-container');
        if (!container || !button.offsetWidth || !button.offsetHeight) {
            segmentedOverlay.classList.remove('is-ready');
            return;
        }

        if (segmentedOverlay.parentNode !== container) {
            container.appendChild(segmentedOverlay);
        }

        segmentedOverlay.classList.toggle('is-instant', !!instant);
        segmentedOverlay.style.setProperty('--indicator-x', (button.offsetLeft - 4) + 'px');
        segmentedOverlay.style.setProperty('--indicator-y', (button.offsetTop + 3) + 'px');
        segmentedOverlay.style.setProperty('--indicator-width', (button.offsetWidth + 6) + 'px');
        segmentedOverlay.style.setProperty('--indicator-height', (button.offsetHeight - 3) + 'px');
        segmentedOverlay.style.setProperty('--indicator-font-size', Math.max(12, Math.min(16, button.offsetHeight * 0.38)) + 'px');
        indicatorLabel.textContent = indicatorLabels[indicatorTarget] || '';
        segmentedOverlay.classList.add('is-ready');

        if (instant) {
            requestAnimationFrame(function () {
                segmentedOverlay.classList.remove('is-instant');
            });
        }
    }

    function updateIndicator(instant) {
        if (indicatorFrame) cancelAnimationFrame(indicatorFrame);
        indicatorFrame = requestAnimationFrame(function () {
            indicatorFrame = null;
            positionIndicator(getVisibleSegmentButton(indicatorTarget), instant);
        });
    }

    function prepareLeavingScreen(screen) {
        var rect = screen.getBoundingClientRect();
        screen.classList.remove('active', 'entering');
        screen.classList.add('leaving');
        screen.style.position = 'absolute';
        screen.style.top = (rect.top + window.scrollY) + 'px';
        screen.style.left = '0';
        screen.style.width = '100%';
        screen.style.zIndex = '1';
    }

    function clearLeavingScreen(screen) {
        screen.classList.remove('active', 'entering', 'leaving');
        screen.style.position = '';
        screen.style.top = '';
        screen.style.left = '';
        screen.style.width = '';
        screen.style.zIndex = '';
    }
function showLoaderThen(targetScreenName, callback) {
    var current = app.querySelector('.screen.active');
    var loader = document.getElementById('screen-loader');
    
    // Hide current screen so it's ready behind the loader
    if (current) current.classList.remove('active', 'entering', 'entering-slide-left');
    
    // Show the loader and lock the screen
    loader.classList.add('active');
    setLock(true);
    
    setTimeout(function() {
        loader.classList.remove('active');
        if (callback) {
            callback();
        } else {
            switchScreen(targetScreenName);
        }
    }, 500);
}
   // Add 'slideIn' as the second parameter
function switchScreen(name) {
    var current = app.querySelector('.screen.active');
    var next = document.getElementById('screen-' + name);
    if (!next || next === current) return;
    
    var softSwap = isSegmentTarget(name) && isSegmentScreen(current);

    if (current && softSwap) {
        prepareLeavingScreen(current);
        setTimeout(function () { clearLeavingScreen(current); }, screenFadeDuration + 20);
    } else if (current) {
        current.classList.remove('active', 'entering', 'entering-slide-left');
    }
    
    if (current && current.id === 'screen-verify') stopVerifyTimer();

    if (name === 'landing') resetLanding();

    // ======= EXACT TARGET LOGIC =======
    // We added 'age' and 'identity' just in case you use those tabs too.
    // It will NEVER slide on 'landing' or 'passcode' now.
   var shouldSlide = (name === 'permit' || name === 'age' || name === 'identity') && !softSwap;

    if (shouldSlide) {
        next.classList.add('active', 'entering-slide-left');
        setTimeout(function () { next.classList.remove('entering-slide-left'); }, 600); // 600ms to match the CSS
    } else {
        // Normal Fade for Landing, Passcode, etc.
        next.classList.add('active', 'entering');
        setTimeout(function () { next.classList.remove('entering'); }, screenFadeDuration);
    }
    // ==================================

    setLock(name === 'landing' || name === 'verify' || name === 'passcode');

    if (name === 'verify') {
        replaySlideUp();
        startVerifyTimer();
    }
    
    if (isSegmentTarget(name)) {
        indicatorTarget = name;
        updateIndicator(false);
    }
}
    // ===== Passcode gate logic =====
    (function () {
        var PIN_LENGTH = 6;
        var entered = 0;
        var pcDots = Array.from(document.querySelectorAll('.pc-dot'));
        var pcNumberKeys = Array.from(document.querySelectorAll('.pc-key[data-pc-num]'));
        var pcBackspaceBtn = document.getElementById('pc-backspace-btn');
        var pcForgotBtn = document.getElementById('pc-forgot-btn');

        function updateDots() {
            pcDots.forEach(function (dot, i) {
                dot.classList.toggle('filled', i < entered);
            });
            pcBackspaceBtn.disabled = entered === 0;
        }

        function pressEffect(el) {
            el.classList.add('pressed');
            setTimeout(function () { el.classList.remove('pressed'); }, 120);
        }

        function unlockApp() {
            indicatorTarget = 'permit';
            showLoaderThen('landing');
        }

        function handleDigit(el) {
            if (entered >= PIN_LENGTH) return;
            pressEffect(el);
            entered += 1;
            updateDots();
            if (entered === PIN_LENGTH) {
                setTimeout(unlockApp, 200);
            }
        }

        pcNumberKeys.forEach(function (key) {
            key.addEventListener('click', function () { handleDigit(key); });
        });

        pcBackspaceBtn.addEventListener('click', function () {
            if (entered === 0) return;
            pressEffect(pcBackspaceBtn);
            entered -= 1;
            updateDots();
        });

        pcForgotBtn.addEventListener('click', function () {
            pressEffect(pcForgotBtn);
        });

        updateDots();
    })();

    // Landing screen's button triggers the 0.5-second loader
    // then switches screen in-app instead of navigating.
    document.querySelector('[data-enter]').addEventListener('click', function (e) {
        e.preventDefault();
        showLoaderThen('permit', function() {
            indicatorTarget = 'permit';
            switchScreen('permit');
            updateIndicator(true);
        });
    });

    // All other in-app buttons
    app.querySelectorAll('[data-target]').forEach(function (link) {
        link.addEventListener('click', function (e) {
            e.preventDefault();

            var target = link.getAttribute('data-target');
            if (isSegmentTarget(target)) indicatorTarget = target;

            function doSwitch() {
                switchScreen(target);
                updateIndicator(false);
            }
if (window.scrollY > 0) {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

                setTimeout(doSwitch, 250);
            } else {
                doSwitch();
            }
        });
    });

app.querySelectorAll('[data-back]').forEach(function (btn) {
    btn.addEventListener('click', function () {
        switchScreen('landing');
        updateIndicator(true);
    });
});

app.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var verifyScreen = document.getElementById('screen-verify');
        var permitScreen = document.getElementById('screen-permit');

        // Reveal permit right now, underneath — it needs to already be
        // visible so it shows through as verify physically slides off it.
        permitScreen.classList.add('active');
        indicatorTarget = 'permit';
        updateIndicator(true);

        // Pin verify as one solid full-screen layer on top of permit, so
        // the transform moves the ENTIRE screen — header, QR, timer, all
        // of it — as a single slab, not just the inner content.
        verifyScreen.style.position = 'fixed';
        verifyScreen.style.top = '0';
        verifyScreen.style.left = '0';
        verifyScreen.style.width = '100%';
        verifyScreen.style.height = '100%';
        verifyScreen.style.zIndex = '500';
        verifyScreen.style.transition = 'none';
        verifyScreen.style.transform = 'translateY(0)';
        void verifyScreen.offsetWidth; // force reflow before animating

        verifyScreen.style.transition = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';
        verifyScreen.style.transform = 'translateY(100%)';

        setTimeout(function () {
            stopVerifyTimer();
            setLock(false);

            verifyScreen.classList.remove('active', 'entering', 'entering-slide-left');
            verifyScreen.removeAttribute('style');

            var wrapper = verifyScreen.querySelector('.page-wrapper');
            wrapper.removeAttribute('style');
            // leave 'slide-up' class on the wrapper as-is, so it's already
            // in its resting visible position next time verify opens
        }, 450);
    });
});
// Watch for scrolling to toggle the header shadow
    window.addEventListener('scroll', function () {
        var headers = document.querySelectorAll('.header');
        // If scrolled more than 5 pixels down, add the shadow
        var isScrolled = window.scrollY > 5; 
        
        headers.forEach(function (header) {
            if (isScrolled) {
                header.classList.add('is-scrolled');
            } else {
                header.classList.remove('is-scrolled');
            }
        });
    });
    window.addEventListener('resize', function () { updateIndicator(true); });
    updateIndicator(true);

    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });
})();
</script>
